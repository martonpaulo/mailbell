name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: Mailbell deliberately excludes some features (see CONTRIBUTING.md).
      options:
        - label: This is not full message bodies, reply, compose, archive, delete, labels, attachments, a backend, or telemetry
          required: true
