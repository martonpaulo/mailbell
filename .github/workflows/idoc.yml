# Static site for Google OAuth application domains and GitHub Pages.
# https://github.com/jaywcjlove/idoc

name: idoc

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create idoc config
        run: |
          cat > idoc.yml << 'EOF'
          site: Mailbell
          description: Minimal macOS menu bar notifier for Gmail. Local IMAP IDLE push, native notifications, opens Gmail Web.
          keywords: macOS, Gmail, menu bar, notifications, IMAP IDLE, OAuth, mailbell
          favicon: Resources/logo.png
          logo: Resources/logo.png

          openSource: https://github.com/samzong/mailbell

          tocs: false

          element:
            wrapper: style=max-width:720px;

          menus:
            Home: index.html
            Privacy: privacy.html
            Terms: terms.html
            GitHub:
              url: https://github.com/samzong/mailbell
              target: __blank

          cacheFileStat: true

          footer: |
            <a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms of Service</a><br />
            Copyright © {{idocYear}} <a href="https://github.com/samzong" target="_blank">samzong</a>
          EOF

      - run: npm install idoc@1 -g
      - run: idoc --dir=website

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: idoc-dist
          path: dist

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: idoc-dist
          path: dist

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: mailbell.samzong.me