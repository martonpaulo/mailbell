name: Deploy

on:
  # Deploy never revalidates: it waits for Validate to pass on main and publishes
  # the exact commit Validate checked (fleet convention, skill-deck #263).
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A deployment that has started always finishes; a newer run waits in the queue
# (GitHub keeps only the newest pending one). Cancelling mid-deploy records an
# `error` status on the github-pages deployment although the site is fine.
# GitHub's own Pages starter workflow does the same.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The release notes and the asset versions are written into a staged copy,
      # never into site/ itself, so nothing generated is committed. The asset
      # versions run last, over every page including the generated ones.
      - name: Stage the site with the release notes
        run: |
          cp -R site "$RUNNER_TEMP/site"
          scripts/render-release-notes.sh --site "$RUNNER_TEMP/site"
          scripts/version-site-assets.sh --site "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
