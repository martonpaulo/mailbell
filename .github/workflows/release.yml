name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Lets the signing, notarization, and Sparkle chain be exercised against an
  # existing tag without inventing a version. Publishing steps still refuse to
  # replace a release that already exists.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to build"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Tests and validation
        run: |
          swift test
          bash scripts/validate.sh

      - name: Derive version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          BUILD=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Enforce release source and version
        run: |
          git fetch origin main
          # A manual run rebuilds an existing tag, which main has usually moved
          # past; only a tag push has to be the tip of main.
          if [ "${{ github.event_name }}" = "push" ]; then
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
              echo "Official release tags must point at the current main commit." >&2
              exit 1
            }
          fi
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Support/Info.plist)
          test "$PLIST_VERSION" = "${{ steps.version.outputs.version }}" || {
            echo "Tag version does not match Support/Info.plist ($PLIST_VERSION)." >&2
            exit 1
          }

      # Publishing an unsigned or credential-less build is never acceptable, and
      # neither is an official tag that goes green without a release. A missing
      # secret therefore fails the job before anything is built or published.
      - name: Check for official release credentials
        env:
          CERT: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.MAILBELL_GOOGLE_CLIENT_ID }}
        run: |
          missing=()
          [ -n "$CERT" ] || missing+=(DEVELOPER_ID_CERT_P12)
          [ -n "$CERT_PASSWORD" ] || missing+=(DEVELOPER_ID_CERT_PASSWORD)
          [ -n "$NOTARY_API_KEY" ] || missing+=(NOTARY_API_KEY)
          [ -n "$NOTARY_API_KEY_ID" ] || missing+=(NOTARY_API_KEY_ID)
          [ -n "$NOTARY_API_ISSUER_ID" ] || missing+=(NOTARY_API_ISSUER_ID)
          [ -n "$SPARKLE_KEY" ] || missing+=(SPARKLE_PRIVATE_KEY)
          [ -n "$GOOGLE_CLIENT_ID" ] || missing+=(MAILBELL_GOOGLE_CLIENT_ID)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Official release blocked: missing secrets: ${missing[*]}" >&2
            echo "Configure them, or cut the release locally with 'make release'." >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          CERT: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          umask 077
          KEYCHAIN=build.keychain
          security create-keychain -p ci "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$CERT" | base64 --decode > cert.p12
          trap 'rm -f cert.p12' EXIT
          security import cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f cert.p12
          trap - EXIT
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application:/ {print $2; exit}')
          case "$IDENTITY" in
            "Developer ID Application:"*) ;;
            *) echo "Official release blocked: no Developer ID Application identity in the P12." >&2; exit 1 ;;
          esac
          echo "MAILBELL_CODE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build and sign the app
        env:
          MAILBELL_GOOGLE_CLIENT_ID: ${{ secrets.MAILBELL_GOOGLE_CLIENT_ID }}
          MAILBELL_GOOGLE_CLIENT_SECRET: ${{ secrets.MAILBELL_GOOGLE_CLIENT_SECRET }}
          MAILBELL_BUNDLE_ID: com.perso.mailbell
        run: |
          # Packages build/Mailbell.app and artifacts/Mailbell-$VERSION.zip, stamped with the
          # tag commit's date as AppReleaseDate.
          scripts/package-with-oauth.sh --identity "$MAILBELL_CODE_SIGN_IDENTITY" \
            --version "${{ steps.version.outputs.version }}" --build-number "${{ steps.version.outputs.build }}"

      # The team App Store Connect API key is written to a private temporary file
      # for scripts/notarize.sh and removed by the always-run step at the end.
      - name: Write notary API key
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          umask 077
          KEY_PATH="$RUNNER_TEMP/notary/AuthKey.p8"
          mkdir -p "$(dirname "$KEY_PATH")"
          printf '%s\n' "$NOTARY_API_KEY" > "$KEY_PATH"
          {
            echo "NOTARY_API_KEY_PATH=$KEY_PATH"
            echo "NOTARY_API_KEY_ID=$NOTARY_API_KEY_ID"
            echo "NOTARY_API_ISSUER_ID=$NOTARY_API_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Notarize, staple, and validate the app
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP="build/Mailbell.app"
          scripts/notarize.sh --artifact "artifacts/Mailbell-$VERSION.zip"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          # Re-archive so the Sparkle update carries the stapled ticket.
          rm "artifacts/Mailbell-$VERSION.zip"
          ditto -c -k --keepParent "$APP" "artifacts/Mailbell-$VERSION.zip"

      - name: Sign the update for Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SIGN=$(find .build/artifacts -path '*/bin/sign_update' -not -path '*old_dsa*' -type f | head -1)
          test -n "$SIGN" || { echo "sign_update not found" >&2; exit 1; }
          SIG=$(echo "$SPARKLE_PRIVATE_KEY" | "$SIGN" --ed-key-file - "artifacts/Mailbell-$VERSION.zip")
          echo "SPARKLE_SIG_ATTRS=$SIG" >> "$GITHUB_ENV"

      # appdmg 0.6.6, which scripts/make-dmg.sh runs, is verified only up to Node 24; pinned
      # so the runner image's default Node can never change the result.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Build, sign, and notarize the DMG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG="artifacts/Mailbell-$VERSION.dmg"
          scripts/make-dmg.sh --version "$VERSION"
          codesign --force --timestamp --sign "$MAILBELL_CODE_SIGN_IDENTITY" "$DMG"
          codesign --verify --verbose=2 "$DMG"
          scripts/notarize.sh --artifact "$DMG"
          spctl -a -t open --context context:primary-signature -vv "$DMG"
          hdiutil verify "$DMG" >/dev/null

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; skipping creation"
            exit 0
          fi
          awk -v version="$VERSION" '
            $0 ~ "^## " version " " { printing=1; next }
            printing && /^## / { exit }
            printing { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "Missing CHANGELOG release notes for $VERSION" >&2; exit 1; }
          gh release create "${{ steps.version.outputs.tag }}" \
            "artifacts/Mailbell-$VERSION.dmg" \
            "artifacts/Mailbell-$VERSION.zip" \
            --title "Mailbell $VERSION" \
            --notes-file release-notes.md

      # After the release exists, so the appcast never advertises an archive
      # that cannot be downloaded yet.
      - name: Update the appcast on main
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          scripts/make-appcast.sh "$VERSION" "${{ steps.version.outputs.build }}" \
            "artifacts/Mailbell-$VERSION.zip" "$SPARKLE_SIG_ATTRS"
          if ! git diff --quiet appcast.xml; then
            git add appcast.xml
            git commit -m "chore(release): appcast entry for $VERSION"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Remove notary API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/notary"
