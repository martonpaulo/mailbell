# Fleet Dependabot configuration (skill-deck project-setup/assets/dependabot.template.yml),
# adapted to Swift. Majors are ignored and reviewed by hand; the cooldown keeps a day-old
# release out of a pull request. A Swift package has no production and development split,
# so its updates form one group.
version: 2

updates:
  - package-ecosystem: "swift"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 3
      semver-major-days: 30
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      swift-packages:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
